  <text text-anchor="middle" font-size="22" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="150.0" y="185.0">NEW</tspan></text>
  <rect x="430" y="135" width="320" height="95" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text text-anchor="middle" font-size="21" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="590.0" y="169.375">RUNNABLE</tspan><tspan x="590.0" y="195.625">(eligible or running)</tspan></text>
  <rect x="940" y="145" width="230" height="80" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text text-anchor="middle" font-size="22" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="1055.0" y="185.0">TERMINATED</tspan></text>
