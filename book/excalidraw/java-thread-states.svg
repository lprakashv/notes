  <text text-anchor="middle" font-size="22" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="200.0" y="550.0">BLOCKED</tspan></text>
  <rect x="445" y="505" width="240" height="90" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
  <text text-anchor="middle" font-size="22" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="565.0" y="550.0">WAITING</tspan></text>
  <rect x="800" y="505" width="340" height="90" rx="12" fill="#ffec99" stroke="#e67700" stroke-width="2"/>
  <text text-anchor="middle" font-size="22" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="970.0" y="550.0">TIMED_WAITING</tspan></text>
