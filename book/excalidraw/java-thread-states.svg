<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 750" width="100%" role="img">
  <title>Java thread lifecycle states</title>
  <desc>Transitions among NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, and TERMINATED with representative causes.</desc>
