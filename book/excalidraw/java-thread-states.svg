  <text text-anchor="middle" font-size="17" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="250" y="354.375">enter: monitor unavailable</tspan><tspan x="250" y="375.625">return: lock acquired</tspan></text>
  <text text-anchor="middle" font-size="17" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="565" y="354.375">enter: wait / join / park</tspan><tspan x="565" y="375.625">return: notify / completion / unpark</tspan></text>
  <text text-anchor="middle" font-size="17" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="900" y="354.375">enter: sleep / timed wait, join, or park</tspan><tspan x="900" y="375.625">return: timeout or signal</tspan></text>
  <text text-anchor="middle" font-size="18" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="610" y="675.0">RUNNABLE includes both executing in the JVM and eligible to execute.</tspan></text>
