  <rect width="100%" height="100%" fill="#ffffff"/>
  <text text-anchor="middle" font-size="28" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="610.0" y="35.0">Java exposes six Thread.State values</tspan></text>
