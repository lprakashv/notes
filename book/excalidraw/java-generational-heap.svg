  <text text-anchor="middle" font-size="17" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="550" y="405.0">This is a teaching model; region-based collectors do not require contiguous generations.</tspan></text>
