  <text text-anchor="middle" font-size="16" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="115.0" y="185.0">new objects</tspan></text>
  <polyline points="560,285 570,330 752,330 752,260" fill="none" stroke="#495057" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-end)" marker-start="url(#arrow-start)"/>
  <text text-anchor="middle" font-size="16" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="672.9511388567678" y="352.0">survivors alternate S0 ↔ S1</tspan></text>
