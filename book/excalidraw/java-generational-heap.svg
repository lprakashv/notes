<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="100%" role="img">
  <title>Conceptual generational heap</title>
  <desc>New objects enter Eden, survivors alternate between survivor spaces, and sufficiently long-lived objects are promoted to the old generation.</desc>
  <metadata>{&quot;provenance&quot;: &quot;AI-generated&quot;, &quot;sourceAssets&quot;: [&quot;archive/original-images/book/java/images/gc.png&quot;]}</metadata>
