  <rect x="570" y="150" width="115" height="110" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text text-anchor="middle" font-size="26" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="627.5" y="205.0">S0</tspan></text>
