  <text text-anchor="middle" font-size="23" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="370" y="105.0">Young generation</tspan></text>
  <text text-anchor="middle" font-size="23" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="865" y="105.0">Old generation</tspan></text>
