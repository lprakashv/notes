<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" role="img">
  <title>Go context cancellation tree</title>
  <desc>Canceling a parent context propagates cancellation to every descendant, while canceling a child does not affect its parent or siblings.</desc>
  <metadata>{&quot;provenance&quot;: &quot;AI-generated&quot;, &quot;sourceAssets&quot;: []}</metadata>
