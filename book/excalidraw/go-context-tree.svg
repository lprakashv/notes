  <rect x="655" y="265" width="260" height="85" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
  <text text-anchor="middle" font-size="19" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="785.0" y="295.625">downstream timeout</tspan><tspan x="785.0" y="319.375">500 milliseconds</tspan></text>
