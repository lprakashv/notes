  <text text-anchor="middle" font-size="18" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="415.0" y="495.0">audit goroutine</tspan></text>
  <rect x="655" y="455" width="260" height="80" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
  <text text-anchor="middle" font-size="18" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="785.0" y="495.0">HTTP call goroutine</tspan></text>
  <polyline points="475,170 295,265" fill="none" stroke="#1971c2" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-end)"/>
  <text text-anchor="middle" font-size="16" font-weight="400" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="385.0" y="202.5">derive</tspan></text>
