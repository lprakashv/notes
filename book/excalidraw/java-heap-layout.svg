    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text text-anchor="middle" font-size="28" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="550.0" y="35.0">PermGen was replaced by native-memory Metaspace</tspan></text>
  <text text-anchor="middle" font-size="24" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="300" y="105.0">Before Java 8</tspan></text>
