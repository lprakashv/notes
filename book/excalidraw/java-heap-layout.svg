  <text text-anchor="middle" font-size="24" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="800" y="105.0">Java 8+</tspan></text>
  <rect x="590" y="145" width="420" height="465" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text text-anchor="middle" font-size="18" font-weight="500" fill="#1e1e1e" font-family="Inter, system-ui, sans-serif"><tspan x="800" y="632.0">JVM process</tspan></text>
