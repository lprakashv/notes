<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" role="img">
  <title>HotSpot memory layout before and after Java 8</title>
  <desc>Before Java 8, PermGen was inside the heap; Java 8 replaced it with native-memory Metaspace outside the heap.</desc>
  <metadata>{&quot;provenance&quot;: &quot;AI-generated&quot;, &quot;sourceAssets&quot;: [&quot;archive/original-images/book/java/images/gc1.png&quot;]}</metadata>
