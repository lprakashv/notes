site_name: Lalit's Tech Notebook
site_description: A collection of technical notes and learnings.
site_author: Lalit Prakash Vatsal
site_url: https://lprakashv.github.io/notes/
repo_url: https://github.com/lprakashv/notes
repo_name: lprakashv/notes
edit_uri: edit/master/book/

docs_dir: book
site_dir: site
strict: true

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - fenced_code
  - shadcn.extensions.excalidraw:
      base_dir: book/excalidraw
      svg_only: true

theme:
  name: shadcn

nav:
  - Home: index.md
  - Programming:
      - Core Concepts:
          - Concurrency: concepts/concurrency.md
      - Java:
          - Garbage Collection: java/java-gc.md
          - Multithreading: java/java-multithreading.md
          - Snippets: java/java-snippets.md
          - Miscellaneous: java/java-misc.md
          - Gradle: java/gradle.md
      - Go:
          - Basic Syntax: go/basic-syntax.md
          - Code Generation: go/code-generation.md
          - Concurrency: go/concurrency.md
          - Context: go/context.md
          - Database Programming: go/database.md
          - gRPC Application: go/grpc-app.md
          - HTTP Services: go/http-services.md
          - Testing: go/testing.md
      - Rust: rust/rust-snippets.md
      - Spring:
          - Data Transactions: spring/spring-data-transactions.md
          - Spring Cloud:
              - Fundamentals: spring/spring-cloud-0.md
              - Distributed Configuration: spring/spring-cloud-1-distributed-config.md
              - Service Discovery: spring/spring-cloud-2-service-discovery.md
              - Intelligent Routing: spring/spring-cloud-3-intelligent-routing.md
              - Client-side Load Balancing: spring/spring-cloud-4-cslb.md
              - Self-healing Services: spring/spring-cloud-5-self-healing-services.md
              - Wrap-up: spring/spring-cloud-6-wrap.md
          - Miscellaneous: spring/spring-misc.md
  - Cloud and Infrastructure:
      - AWS: aws/aws-assentials.md
      - Kubernetes:
          - Overview: kubernetes/kubernetes-intro.md
          - Namespaces: kubernetes/namespaces.md
  - Data:
      - Data Engineering:
          - Overview: data-engineering/data-engineering.md
          - Apache Spark: data-engineering/apache-spark.md
          - Big Data: data-engineering/big-data.md
      - Databases:
          - Overview: databases/databases.md
          - SQLite: databases/sqlite.md
  - AI and Machine Learning:
      - Generative AI:
          - Amazon Bedrock: generative-ai/amazon-bedrock.md
          - Building Systems with ChatGPT: generative-ai/building-systems-with-chatgpt.md
          - Enhancing RAG with RAPTOR: generative-ai/enhance-rag-with-raptor.md
          - LangChain: generative-ai/langchain.md
          - LangSmith: generative-ai/langsmith.md
          - LlamaIndex: generative-ai/llamaindex.md
          - Prompt Engineering: generative-ai/prompt-engineering.md
      - MLOps: mlops/ml-in-production.md
  - Observability:
      - OpenTelemetry:
          - Collector: opentelemetry/collector.md
          - Go SDK: opentelemetry/go-sdk.md
          - Logs: opentelemetry/logs.md
          - Metrics: opentelemetry/metrics.md
  - Cheat Sheets:
      - Docker: cheatsheets/docker-cheatsheet.md
      - kubectl: cheatsheets/kubectl-cheatsheet.md
      - Miscellaneous HowTos: cheatsheets/misc.md
  - Work Learnings Journal: journal.md
